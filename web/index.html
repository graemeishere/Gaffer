<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaffer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<style>
/* Same tokens as the board, so the two pages read as one thing. Light only:
   the kraft paper is the design, not a preference. */
:root{
  --paper:oklch(0.96 0.016 78);
  --paper2:oklch(0.985 0.01 78);
  --rule:oklch(0.86 0.03 75);
  --ink:oklch(0.27 0.06 264);
  --ink-soft:oklch(0.46 0.05 264);
  --ink-faint:oklch(0.60 0.04 264);
  --highlight:oklch(0.87 0.17 111);
  --red:oklch(0.55 0.2 27);
  --bad:oklch(0.58 0.19 27);
  --neutral:oklch(0.8 0.006 90);
  --shadow:rgba(40,30,10,.14);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:1.1rem .9rem 3rem;
  display:flex;flex-direction:column;gap:1.4rem;}
/* The hand carries voice only, never a number. */
h1{font-family:Caveat,cursive;font-weight:700;font-size:2.4rem;line-height:1.05;margin:0;
  transform:rotate(-1.2deg);transform-origin:left center;}
.bar{font-size:.66rem;letter-spacing:.06em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
  display:flex;flex-wrap:wrap;gap:.25rem .8rem;padding-top:.6rem;border-top:1px dashed var(--rule);}
.stale{background:var(--paper2);border:1.5px solid var(--ink);border-left:5px solid var(--bad);
  border-radius:7px;padding:.8rem .9rem;color:var(--bad);
  font-size:.85rem;font-weight:600;box-shadow:0 3px 0 var(--shadow);}
.banner{background:var(--paper2);border:1.5px solid var(--ink);border-left:5px solid var(--highlight);
  border-radius:7px;padding:.8rem .9rem;color:var(--ink-soft);font-size:.86rem;line-height:1.55;
  box-shadow:0 3px 0 var(--shadow);}
.controls{display:flex;gap:6px;flex-wrap:wrap;}
button{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.02em;padding:9px 12px;border-radius:6px;
  border:1.5px solid var(--ink);background:var(--paper2);color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 var(--shadow);}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none;}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
.scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper2);
  box-shadow:0 2px 0 var(--shadow);}
table{border-collapse:collapse;width:100%;font-size:.78rem;min-width:560px;}
th{text-align:left;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-faint);padding:.45rem .5rem;border-bottom:1.5px solid var(--ink);
  white-space:nowrap;cursor:pointer;}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;}
td{padding:.4rem .5rem;border-bottom:1px dashed var(--rule);color:var(--ink-soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.name{color:var(--ink);font-weight:600;}
.pill{display:inline-block;font-size:.55rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:.14em .4em;border-radius:4px;white-space:nowrap;
  border:1px solid var(--ink);}
.pill.warn{background:var(--highlight);color:var(--ink);}
.pill.stop{background:var(--bad);color:var(--paper2);}
.pill.low{background:var(--neutral);color:var(--ink);}
@media (min-width:900px){
  body{font-size:16px;}
  .wrap{padding:2.2rem 1.6rem 4rem;gap:1.8rem;}
  h1{font-size:3.1rem;}
  table{font-size:.83rem;}
  button{font-size:12px;}
}
@media (prefers-reduced-motion:reduce){*{transform:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Gaffer</h1>
    <p style="font-size:.86rem;color:var(--ink-soft);margin:.3rem 0 0">
      Sortable player board. The full picture — squad, transfers, chips and your
      mini-league — is on <a href="report.html" style="color:var(--red);font-weight:600">the
      main board</a>.
    </p>
    <div class="bar" id="bar"><span>loading…</span></div>
  </div>
  <div id="stale"></div>
  <div class="banner" id="warning"></div>
  <div class="controls" id="filters"></div>
  <div class="scroll"><table>
    <thead><tr>
      <th data-k="name">Player</th><th data-k="team">Team</th><th data-k="position">Pos</th>
      <th class="num" data-k="price">£m</th><th class="num" data-k="projected">Proj</th>
      <th class="num" data-k="per_million">per £m</th><th class="num" data-k="fixture_score">Fix</th>
      <th>Flags</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
<script>
const POSITIONS = ["ALL", "GKP", "DEF", "MID", "FWD"];
let data = null, position = "ALL", sortKey = "projected", desc = true;

function flags(p) {
  const out = [];
  if (p.moved_club) out.push('<span class="pill warn">new club</span>');
  if (p.availability < 1) out.push(`<span class="pill stop">${Math.round(p.availability * 100)}% fit</span>`);
  if (p.confidence === "low") out.push('<span class="pill low">thin data</span>');
  return out.join(" ");
}

function render() {
  const rows = data.players
    .filter(p => position === "ALL" || p.position === position)
    .sort((a, b) => {
      const [x, y] = [a[sortKey], b[sortKey]];
      const cmp = typeof x === "string" ? x.localeCompare(y) : x - y;
      return desc ? -cmp : cmp;
    })
    .slice(0, 60);

  document.getElementById("rows").innerHTML = rows.map(p => `
    <tr>
      <td class="name">${p.name}</td><td>${p.team}</td><td>${p.position}</td>
      <td class="num">${p.price.toFixed(1)}</td>
      <td class="num">${p.projected.toFixed(1)}</td>
      <td class="num">${p.per_million.toFixed(2)}</td>
      <td class="num">${p.fixture_score.toFixed(2)}</td>
      <td>${flags(p)}</td>
    </tr>`).join("");
}

function boot(payload) {
  data = payload;
  const m = payload.meta;
  const generated = new Date(m.generated);
  const ageHours = (Date.now() - generated) / 3.6e6;

  document.getElementById("bar").innerHTML = [
    `GAMEWEEK ${m.gameweek}`,
    `DEADLINE ${new Date(m.deadline).toUTCString().slice(0, 22)}`,
    `HORIZON ${m.horizon} GW`,
    `GENERATED ${generated.toUTCString().slice(5, 22)}`,
    `${payload.counts.players_ranked} PLAYERS`,
  ].map(s => `<span>${s}</span>`).join("");

  // A stale recommendation shown confidently is worse than no recommendation.
  if (ageHours > 24) {
    document.getElementById("stale").className = "stale";
    document.getElementById("stale").textContent =
      `This data is ${Math.floor(ageHours / 24)} day(s) old. The engine has not run since ` +
      `${generated.toUTCString()}. Prices and injuries will have moved — do not act on it.`;
  }
  document.getElementById("warning").textContent = m.warning;

  document.getElementById("filters").innerHTML = POSITIONS
    .map(p => `<button data-pos="${p}" aria-pressed="${p === position}">${p}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b =>
    b.onclick = () => { position = b.dataset.pos; boot(data); });

  document.querySelectorAll("th[data-k]").forEach(th =>
    th.onclick = () => {
      const k = th.dataset.k;
      if (k === sortKey) desc = !desc; else { sortKey = k; desc = true; }
      render();
    });

  render();
}

fetch("latest.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(boot)
  .catch(err => {
    document.getElementById("bar").innerHTML = "";
    document.getElementById("stale").className = "stale";
    document.getElementById("stale").textContent =
      `Could not load latest.json (${err.message}). The engine may not have run yet.`;
  });
</script>
</body>
</html>
