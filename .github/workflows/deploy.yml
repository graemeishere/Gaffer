name: deploy

# Deploys to a VPS over SSH on every push to master, if the three repository
# secrets below are set. Without them the job does nothing — but it says so
# loudly rather than passing silently, because a "green" run that quietly
# deployed nothing is how this went unnoticed for weeks.
#
#   VPS_HOST     the host or IP
#   VPS_USER     a user who can run `sudo bash setup.sh` without a password
#                (root is simplest; a sudoer with NOPASSWD also works)
#   VPS_SSH_KEY  the matching private key
#
# See deploy/README.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy credentials
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::No VPS secrets set — nothing was deployed. Add VPS_HOST, VPS_USER and VPS_SSH_KEY (see deploy/README.md)."
            {
              echo "### Deploy skipped"
              echo "No \`VPS_HOST\` secret, so this push was **not** deployed to the VPS."
              echo "Set \`VPS_HOST\`, \`VPS_USER\` and \`VPS_SSH_KEY\` to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy over SSH, then confirm the VPS is on this commit
        if: steps.check.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Accept the key either as base64 (robust — a Windows clipboard mangles
          # a raw key's line endings and whitespace, which OpenSSH then rejects
          # with "error in libcrypto") or as a raw PEM. Whichever decodes to a
          # private key is what gets written.
          if printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q 'PRIVATE KEY'; then
            printf '%s' "$KEY" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # setup.sh fetches master, reinstalls the unit, and does a full run
          # that republishes the pages — a complete deploy on its own.
          ssh -o BatchMode=yes "$USER@$HOST" 'sudo bash /srv/gaffer/deploy/setup.sh'

          # Prove it landed: the pushed commit must be present on the VPS. Checked
          # as "is an ancestor of HEAD" rather than exact equality, so an hourly
          # data-refresh commit racing ahead of this run does not read as a
          # failed deploy — the VPS having more than we pushed is still a success.
          if ssh -o BatchMode=yes "$USER@$HOST" "git -C /srv/gaffer merge-base --is-ancestor $SHA HEAD"; then
            echo "Deployed: VPS includes $SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            remote_sha="$(ssh -o BatchMode=yes "$USER@$HOST" 'git -C /srv/gaffer rev-parse HEAD')"
            echo "::error title=Deploy did not land::VPS is on $remote_sha, which does not include $SHA."
            exit 1
          fi
