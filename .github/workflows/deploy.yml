name: deploy

# Optional. Deploys to a VPS over SSH on every push to the working branch.
# Needs three repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# Without them the job skips rather than failing, so the repo works fine
# for anyone who deploys by hand instead.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy credentials
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No VPS secrets set — skipping. See deploy/README.md."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes "$USER@$HOST" 'sudo bash /srv/gaffer/deploy/setup.sh'
