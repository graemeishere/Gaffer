name: refresh

# The engine now decides for itself what work is due, from the next deadline
# rather than the calendar (see gaffer/schedule.py) — FPL deadlines land on four
# weekdays at six clock times, so a fixed weekly cron would miss most of the
# season. This runs twice a day purely to keep the published board visible; the
# hourly wake-up that drives the real schedule belongs on the VPS cron.
on:
  schedule:
    - cron: "0 3 * * *"    # after overnight price changes settle
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [claude/fantasy-football-recommendations-7q0di3]
    paths: ["gaffer/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

      - name: Run the engine
        run: python -m gaffer.run --refresh --top 20

      - name: Score past predictions against results
        run: python -m gaffer.score

      - name: Publish the run
        run: |
          # web/ is the published copy. data/ is the local run's output and is
          # gitignored, so the two never collide.
          cp data/latest.json data/report.html web/
          git config user.name  "gaffer-bot"
          git config user.email "noreply@github.com"
          git add -f web/latest.json web/report.html
          # The prediction log is the experiment's evidence and the CI container
          # is thrown away after every run, so it has to be committed or it is lost.
          git add record/predictions.csv record/actuals.csv
          if git diff --staged --quiet; then
            echo "No change in output — nothing to publish."
          else
            git commit -m "run: gameweek data refresh [skip ci]"
            git push
          fi
