[project]
name = "gaffer"
version = "0.1.0"
description = "A Fantasy Premier League squad engine: expected points, optimisation, and mini-league strategy."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pulp[cbc]>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gaffer = "gaffer.run:main"

[tool.setuptools.packages.find]
include = ["gaffer*"]
